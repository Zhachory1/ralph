model:
  provider: anthropic
  default: claude-opus-5
platform_toolsets:
  cli:
    # Runs training and evaluation code, so it needs a terminal and a
    # sandbox. Opus because a bad experiment design wastes compute, which
    # is the expensive mistake this profile can make.
    - code_execution
    - file
    - web
  api_server: [no_mcp]
approvals:
  # A profile's config replaces the global one rather than merging into it,
  # so a profile that runs commands has to carry this itself. A card-dispatched
  # worker has nobody present to answer a prompt, and the default is to refuse
  # the approval-gated tools outright, which makes board work strictly weaker
  # than the same work run by hand. The sandbox is the boundary; smart approval
  # still refuses what it judges genuinely dangerous.
  single_query_mode: approve
  unattended_mode: approve

memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  external_dirs:
    - /ralph/skills/voice
  # No lane. This profile's work is reading and reporting, and an
  # index it never uses is prompt it always pays for.
  creation_nudge_interval: 0
agent:
  max_turns: 150
  run_budget_seconds: 7200
  api_max_retries: 0
