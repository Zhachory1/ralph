model:
  provider: anthropic
  default: claude-sonnet-5
platform_toolsets:
  cli:
    - code_execution
    - file
  api_server: [no_mcp]
approvals:
  # A profile's config replaces the global one rather than merging into it,
  # so a profile that runs commands has to carry this itself. A card-dispatched
  # worker has nobody present to answer a prompt, and the default is to refuse
  # the approval-gated tools outright, which makes board work strictly weaker
  # than the same work run by hand. The sandbox is the boundary; smart approval
  # still refuses what it judges genuinely dangerous.
  single_query_mode: approve
  unattended_mode: approve

memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  creation_nudge_interval: 0
agent:
  max_turns: 120
  run_budget_seconds: 3600
  api_max_retries: 0
