# Ported from the fleet's pr-review-synthesis-v2. One line differs: provider
# (openai-codex -> openai-api). Model is unchanged: gpt-6-sol, matching the
# fleet's production use for this role.
model:
  provider: openai-api
  default: gpt-6-sol
platform_toolsets:
  # file-only. Synthesis reads each lens's staged result and the diff; it
  # does not read live GitHub and does not post. The publisher -- a
  # deterministic process, not an agent -- owns the one GitHub write and
  # re-checks the head before making it. This profile cannot bypass that
  # even if it wanted to: it has no network and no GitHub credential.
  cli:
    - file
  api_server: [no_mcp]
approvals:
  single_query_mode: approve
  unattended_mode: approve
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
mcp_servers:
  lens-tools:
    command: "${HERMES_PYTHON:-/opt/hermes/.venv/bin/python3}"
    args: ["/ralph/bootstrap/lens-tools"]
    enabled: true
    worker_only: true
    env:
      LENS_TASK_ID: "${HERMES_KANBAN_TASK}"
      LENS_RUN_ID: "${HERMES_KANBAN_RUN_ID}"
      LENS_CLAIM_LOCK: "${HERMES_KANBAN_CLAIM_LOCK}"
      LENS_BOARD: "${HERMES_KANBAN_BOARD}"
      LENS_DB: "${HERMES_KANBAN_DB}"
      LENS_WORKSPACE: "${HERMES_KANBAN_WORKSPACE}"
      LENS_EVIDENCE_ROOT: "${HERMES_KANBAN_WORKSPACE}/evidence"
      LENS_PROFILE: "${HERMES_PROFILE}"
      LENS_TOOLS_PYTHON: "${HERMES_PYTHON:-/opt/hermes/.venv/bin/python3}"
    tools:
      # kanban_parent_handoffs is the one tool only this profile may call:
      # bootstrap/lens-tools refuses it for any profile other than
      # ralph-review-synthesis on the queues board, checked server-side, not
      # by omitting it from another profile's include list alone.
      include: [evidence_read, evidence_search, kanban_show, kanban_parent_handoffs, kanban_heartbeat, kanban_complete, kanban_block]
skills:
  external_dirs:
    - /ralph/skills/voice
  creation_nudge_interval: 0
agent:
  disabled_toolsets: [delegation, kanban, terminal, code_execution, browser, computer_use, web, skills, memory, vision, image_gen, tts, todo, connections]
  max_turns: 80
  run_budget_seconds: 480
  api_max_retries: 0
