# Ported from the fleet's pr-review-generalist-v2, which is defined in git but
# not what production currently dispatches onto the generalist role -- that
# runs under the fleet's older pr-review-v1, which also orchestrates and
# publishes. This shape is deliberately narrower than that, matching what the
# design calls for rather than what happens to be running today.
#
# Two lines differ from the fleet's config: provider (openai-codex -> openai-api,
# an API key rather than a device-code OAuth flow) and model (gpt-6-sol ->
# gpt-6-luna). The model change is the one line in this port that is not a
# straight copy -- see Design-Doc section 2, dissent 5.
model:
  provider: openai-api
  default: gpt-6-luna
platform_toolsets:
  # file-only, no terminal, no network: PR 3's restricted evidence server does
  # not exist yet, so this profile reads a diff staged into its workspace by
  # whatever dispatches it -- by hand for now. It cannot reach GitHub, cannot
  # create cards, and cannot post anything, which is the one property this
  # profile must have before it ever reads a real PR.
  cli:
    - file
  api_server: [no_mcp]
approvals:
  single_query_mode: approve
  unattended_mode: approve
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
mcp_servers:
  lens-tools:
    # The one piece of fleet machinery worth carrying over (Design-Doc
    # section 3). Every env value here is a Hermes-supplied worker fact,
    # resolved only inside a real dispatch -- there is nothing to configure
    # per profile beyond pointing at the script and the Python that runs it.
    command: "${HERMES_PYTHON:-/opt/hermes/.venv/bin/python3}"
    args: ["/ralph/bootstrap/lens-tools"]
    enabled: true
    worker_only: true
    env:
      LENS_TASK_ID: "${HERMES_KANBAN_TASK}"
      LENS_RUN_ID: "${HERMES_KANBAN_RUN_ID}"
      LENS_CLAIM_LOCK: "${HERMES_KANBAN_CLAIM_LOCK}"
      LENS_BOARD: "${HERMES_KANBAN_BOARD}"
      LENS_DB: "${HERMES_KANBAN_DB}"
      LENS_WORKSPACE: "${HERMES_KANBAN_WORKSPACE}"
      # bootstrap/stage-review-evidence writes its output directly into the
      # card's own workspace (PR 4 passes --work-root pointing there), so
      # this is simply that workspace's evidence/ subdirectory -- no shared
      # work root, no path a second card could collide on.
      LENS_EVIDENCE_ROOT: "${HERMES_KANBAN_WORKSPACE}/evidence"
      LENS_PROFILE: "${HERMES_PROFILE}"
      LENS_TOOLS_PYTHON: "${HERMES_PYTHON:-/opt/hermes/.venv/bin/python3}"
    tools:
      include: [evidence_read, evidence_search, kanban_show, kanban_heartbeat, kanban_complete, kanban_block]
skills:
  creation_nudge_interval: 0
agent:
  disabled_toolsets: [delegation, kanban, terminal, code_execution, browser, computer_use, web, skills, memory, vision, image_gen, tts, todo, connections]
  max_turns: 80
  run_budget_seconds: 480
  api_max_retries: 0
