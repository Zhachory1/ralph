model:
  provider: anthropic
  default: claude-sonnet-5
platform_toolsets:
  cli:
    # Queries and a write-up. No terminal: an analysis ends in a document,
    # and a read-only warehouse credential should not sit next to a shell.
    - file
    - web
  api_server: [no_mcp]
approvals:
  # A profile's config replaces the global one rather than merging into it,
  # so every profile dispatched from the board has to carry this itself. A
  # card worker has nobody present to answer a prompt, and the default is to
  # refuse the approval-gated tools outright, which makes board work strictly
  # weaker than the same work run by hand. The sandbox is the boundary; smart
  # approval still refuses what it judges genuinely dangerous.
  single_query_mode: approve
  unattended_mode: approve

memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  creation_nudge_interval: 0
agent:
  max_turns: 60
  run_budget_seconds: 1800
  api_max_retries: 0
