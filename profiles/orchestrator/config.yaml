model:
  provider: anthropic
  default: claude-sonnet-5
platform_toolsets:
  cli:
    # The board is the orchestrator's whole job: it plans work as linked cards
    # and watches for cards that stalled. Without the kanban toolset it can
    # read a brief and reason about a graph, and then do nothing about it.
    - kanban
    - code_execution
    - file
  api_server: [no_mcp]
memory:
  memory_enabled: false
  user_profile_enabled: false
auxiliary:
  background_review:
    enabled: false
skills:
  creation_nudge_interval: 0
agent:
  max_turns: 60
  run_budget_seconds: 900
  api_max_retries: 0
