# Add to paperclip-private.yml for a fresh PostgreSQL-backed installation.
services:
  paperclip:
    environment:
      DATABASE_URL: "postgresql://paperclip:${PAPERCLIP_POSTGRES_PASSWORD:?Set a dedicated URL-safe PostgreSQL password}@postgres:5432/paperclip"
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: "${PAPERCLIP_PUBLIC_URL:?Set the Paperclip origin}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_TAILNET_HOSTNAME:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, database]
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: "${PAPERCLIP_POSTGRES_PASSWORD:?Set a dedicated URL-safe PostgreSQL password}"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "paperclip", "-d", "paperclip"]
      interval: 2s
      timeout: 3s
      retries: 15
networks:
  database:
    internal: true
volumes:
  postgres:
