# Ralph runs as its own Hermes, in its own container, with its own HERMES_HOME.
#
# It deliberately shares nothing with a Hermes you may already run on the host:
# separate home volume, separate board database, separate profiles, separate
# port. Installing Ralph must never disturb an existing setup.

name: ralph

services:
  # Narrows the Docker API the hermes container can reach.
  #
  # The builder runs untrusted code: dependency install scripts, test suites,
  # and code it just wrote, from repositories whose READMEs and Makefiles can
  # carry prompt injection. That has to happen in a sandbox container, and
  # creating one needs Docker API access.
  #
  # Mounting the raw socket would be worse than no sandbox at all: socket
  # access is root-equivalent on the host, so injected code could mount the
  # host filesystem and read everything this design is trying to protect.
  # The proxy exposes only container lifecycle, so a compromised agent can
  # start and stop sandboxes and nothing else.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    environment:
      # Allowed: enough to create, run, inspect, and remove a sandbox.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      EXEC: 1
      # Refused. Each would hand back something the proxy exists to withhold:
      # volume and network control to reach the host or other services, swarm
      # and system to reconfigure the daemon, auth to read credentials.
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      SWARM: 0
      NODES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISTRIBUTION: 0
      INFO: 0
      BUILD: 0
      COMMIT: 0
      SESSION: 0
    volumes:
      # Read-only, and never exposed outside this compose network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Creates profiles, boards, and labels, then exits. Runs before hermes
  # starts and is safe to re-run: every step is idempotent.
  init:
    image: ghcr.io/zhachory1/ralph-init:${RALPH_VERSION:-dev}
    build:
      context: ..
      dockerfile: compose/Dockerfile.init
    environment:
      HERMES_HOME: /home/hermes/.hermes
      RALPH_BOARD: ${RALPH_BOARD:-ralph}
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - hermes-home:/home/hermes/.hermes
      - ../profiles:/ralph/profiles:ro
      - ../bootstrap:/ralph/bootstrap:ro
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION:?set HERMES_VERSION, never latest}
    # The image defaults to interactive chat, which exits immediately with no
    # terminal. Ralph needs the gateway, which is what runs the dispatcher.
    command: ["gateway", "run"]
    depends_on:
      socket-proxy:
        condition: service_started
      init:
        condition: service_completed_successfully
    environment:
      HERMES_HOME: /home/hermes/.hermes
      # Run agent commands in sibling sandbox containers rather than in this
      # one, reached only through the proxy above.
      # Agent commands run in a per-profile sibling container, not in here.
      # Verified: that sandbox cannot see the host filesystem, the Docker
      # socket, the board, or any credential. See
      # docs/spikes/sandbox-isolation.md and evals/test_sandbox_isolation.py.
      TERMINAL_ENV: ${RALPH_TERMINAL_ENV:-docker}
      DOCKER_HOST: tcp://socket-proxy:2375
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - hermes-home:/home/hermes/.hermes
      - ${RALPH_WORKSPACES:-./workspaces}:/workspaces
      - ../evals:/ralph/evals:ro
    ports:
      # Bound to localhost. The dashboard has no authentication.
      - "127.0.0.1:${RALPH_DASHBOARD_PORT:-9219}:9219"
    restart: unless-stopped

  # Polls the board for gates waiting on a human and posts them to chat.
  notifier:
    image: ghcr.io/zhachory1/ralph-init:${RALPH_VERSION:-dev}
    build:
      context: ..
      dockerfile: compose/Dockerfile.init
    depends_on:
      hermes:
        condition: service_started
    command: ["/ralph/bootstrap/run-notifier"]
    environment:
      HERMES_HOME: /home/hermes/.hermes
      RALPH_BOARD: ${RALPH_BOARD:-ralph}
      RALPH_POLL_SECONDS: ${RALPH_POLL_SECONDS:-900}
      # Repository work, not model access: see .env.example.
      GH_TOKEN: ${RALPH_GITHUB_TOKEN:-${GH_TOKEN:-}}
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - hermes-home:/home/hermes/.hermes
      - ../notifier:/ralph/notifier:ro
      - ../bootstrap:/ralph/bootstrap:ro
      - notifier-state:/var/lib/ralph
    restart: unless-stopped

volumes:
  # Named, not a bind mount of ~/.hermes: Ralph's Hermes state is its own.
  hermes-home:
  notifier-state:
