# Ralph runs as its own Hermes, in its own container, with its own HERMES_HOME.
#
# It deliberately shares nothing with a Hermes you may already run on the host:
# separate home volume, separate board database, separate profiles, separate
# port. Installing Ralph must never disturb an existing setup.

name: ralph

services:
  # Narrows the Docker API the hermes container can reach.
  #
  # The builder runs untrusted code: dependency install scripts, test suites,
  # and code it just wrote, from repositories whose READMEs and Makefiles can
  # carry prompt injection. That has to happen in a sandbox container, and
  # creating one needs Docker API access.
  #
  # Mounting the raw socket would be worse than no sandbox at all: socket
  # access is root-equivalent on the host, so injected code could mount the
  # host filesystem and read everything this design is trying to protect.
  # The proxy exposes only container lifecycle, so a compromised agent can
  # start and stop sandboxes and nothing else.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION:-0.3.0}
    environment:
      # Allowed: enough to create, run, inspect, and remove a sandbox.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      EXEC: 1
      # Refused. Each would hand back something the proxy exists to withhold:
      # volume and network control to reach the host or other services, swarm
      # and system to reconfigure the daemon, auth to read credentials.
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      SWARM: 0
      NODES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      DISTRIBUTION: 0
      INFO: 0
      BUILD: 0
      COMMIT: 0
      SESSION: 0
    volumes:
      # Read-only, and never exposed outside this compose network.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Creates profiles, boards, and labels, then exits. Runs before hermes
  # starts and is safe to re-run: every step is idempotent.
  init:
    image: ghcr.io/zhachory1/ralph-notifier:${RALPH_VERSION:-dev}
    build:
      context: ..
      dockerfile: compose/Dockerfile.notifier
    command: ["/ralph/bootstrap/install"]
    # Runs after hermes rather than before it: the CLI it configures lives in
    # that container, reached through the proxy.
    depends_on:
      socket-proxy:
        condition: service_started
      hermes:
        condition: service_started
    environment:
      HERMES_HOME: /home/hermes/.hermes
      RALPH_BOARD: ${RALPH_BOARD:-ralph}
      RALPH_HERMES_CONTAINER: ralph-hermes-1
      DOCKER_HOST: tcp://socket-proxy:2375
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - hermes-home:/home/hermes/.hermes
      - ../profiles:/ralph/profiles:ro
      - ../bootstrap:/ralph/bootstrap:ro
      # Writable here and read-only everywhere else, which is the whole
      # difference between this service and the agent. init installs the
      # pinned third-party skills into their lanes; nothing else may write a
      # skill, and the agent's own mount below stays :ro so a skill_manage
      # patch still fails with an error it can see.
      - ../skills:/ralph/skills
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION:?set HERMES_VERSION, never latest}
    # The image defaults to interactive chat, which exits immediately with no
    # terminal. Ralph needs the gateway, which is what runs the dispatcher.
    command: ["gateway", "run"]
    depends_on:
      socket-proxy:
        condition: service_started
    environment:
      HERMES_HOME: /home/hermes/.hermes
      # The dashboard: the monitor, and the reason port 9219 is published.
      # Hermes' image starts it only when HERMES_DASHBOARD is truthy, so until
      # this was set the port mapped to nothing and the "monitor" did not
      # exist. Its port must also match the container side of the mapping
      # below; the image's default is 9119.
      #
      # It binds 0.0.0.0 inside the container because that is the only way a
      # published port reaches it, and the image's auth gate engages on any
      # non-loopback bind and refuses to start without a provider. The
      # password here satisfies that gate. From the machine it is reachable
      # on 127.0.0.1 alone, by the mapping below; a 0.0.0.0 bind is also
      # reachable by every other container on this stack's network, which is
      # what the password is actually guarding.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9219"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${RALPH_DASHBOARD_USER:-ralph}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${RALPH_DASHBOARD_PASSWORD:?run bootstrap/secrets to generate RALPH_DASHBOARD_PASSWORD}
      # Run agent commands in sibling sandbox containers rather than in this
      # one, reached only through the proxy above.
      # Agent commands run in a per-profile sibling container, not in here.
      # Verified: that sandbox cannot see the host filesystem, the Docker
      # socket, the board, or any credential. See
      # docs/spikes/sandbox-isolation.md and evals/test_sandbox_isolation.py.
      TERMINAL_ENV: ${RALPH_TERMINAL_ENV:-docker}
      DOCKER_HOST: tcp://socket-proxy:2375
      # Hermes reads this env var for the sandbox image, and it wins over
      # the config key, so setting only the config silently keeps the stock
      # image and the agent finds no git and no gh.
      TERMINAL_DOCKER_IMAGE: ${RALPH_SANDBOX_IMAGE:-ghcr.io/zhachory1/ralph-sandbox:dev}
      # Same story as the image above: the env var wins over the config key,
      # so setting only the config leaves the sandbox without these.
      TERMINAL_DOCKER_FORWARD_ENV: '["GH_TOKEN","GITHUB_TOKEN","GIT_AUTHOR_NAME","GIT_AUTHOR_EMAIL","GIT_COMMITTER_NAME","GIT_COMMITTER_EMAIL","BUF_TOKEN"]' 
      # Repository work inside the sandbox. This is the only credential that
      # crosses into it; the model key and the chat webhook do not.
      GH_TOKEN: ${RALPH_GITHUB_TOKEN:-}
      GIT_AUTHOR_NAME: ${RALPH_GIT_NAME:-Ralph}
      GIT_AUTHOR_EMAIL: ${RALPH_GIT_EMAIL:-ralph@localhost}
      GIT_COMMITTER_NAME: ${RALPH_GIT_NAME:-Ralph}
      GIT_COMMITTER_EMAIL: ${RALPH_GIT_EMAIL:-ralph@localhost}
      # A private package registry a repository depends on. Without it an
      # install fails and an agent stubs modules to get the app running at
      # all, which makes the sandbox an unfaithful copy of where the code runs.
      BUF_TOKEN: ${BUF_TOKEN:-}
      # hermes-webui below runs this agent in-process rather than through a
      # stable API, so it needs this image's own /opt/hermes on disk rather
      # than calling in. The gateway API server is also idle by default;
      # hermes-webui's "gateway pill" needs it bound with a shared key.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${RALPH_WEBUI_API_KEY:-}
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - hermes-home:/home/hermes/.hermes
      - ${RALPH_WORKSPACES:-./workspaces}:/workspaces
      - ../evals:/ralph/evals:ro
      # Read-only on purpose. A skill_manage patch against this tree fails with
      # an error the agent can see, which makes "an agent cannot rewrite a
      # shipped skill" a permission rather than a sentence in a prompt.
      - ../skills:/ralph/skills:ro
      # The private overlay, mounted only when its checkout is beside this one.
      # Profiles name a lane under it; a profile whose lane is absent simply has
      # no tier-2 skills, which is the state before PR 5 lands anywhere.
      - ${RALPH_PRIVATE_SKILLS:-../../rokt-it-ralph/skills}:/ralph/private-skills:ro
      # Populated from this image's own /opt/hermes on first start, then
      # reused verbatim -- not refreshed by a later pull. See hermes-webui's
      # entry in "Upgrading" below. hermes-webui mounts this read-only.
      - hermes-agent-src:/opt/hermes
    ports:
      # Bound to localhost. The dashboard has no authentication.
      - "127.0.0.1:${RALPH_DASHBOARD_PORT:-9219}:9219"
    restart: unless-stopped

  # Polls the board for gates waiting on a human and posts them to chat.
  # Runs after hermes is up, because it configures hermes through its CLI.
  notifier:
    # A small image, not the Hermes one. It runs two stdlib Python scripts
    # and shells out, so carrying a 4.5GB image for the CLI doubled the
    # stack's disk for nothing. Board commands go through the hermes
    # container; see RALPH_HERMES_CONTAINER below.
    image: ghcr.io/zhachory1/ralph-notifier:${RALPH_VERSION:-dev}
    build:
      context: ..
      dockerfile: compose/Dockerfile.notifier
    depends_on:
      hermes:
        condition: service_started
      socket-proxy:
        condition: service_started
      init:
        condition: service_completed_successfully
    command: ["/ralph/bootstrap/run-notifier"]
    environment:
      HERMES_HOME: /home/hermes/.hermes
      RALPH_BOARD: ${RALPH_BOARD:-ralph}
      RALPH_POLL_SECONDS: ${RALPH_POLL_SECONDS:-900}
      # Local hour the morning digest goes out, once a day.
      RALPH_DIGEST_HOUR: ${RALPH_DIGEST_HOUR:-8}
      # Repository work, not model access: see .env.example. The fallback is
      # deliberate but lossy — GH_TOKEN alone is a Copilot credential and
      # cannot see a private repository, which surfaces as a 404 on a pull
      # request that plainly exists.
      GH_TOKEN: ${RALPH_GITHUB_TOKEN:?set RALPH_GITHUB_TOKEN; a model credential cannot read pull requests}
      RALPH_HERMES_CONTAINER: ralph-hermes-1
      DOCKER_HOST: tcp://socket-proxy:2375
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - ../notifier:/ralph/notifier:ro
      - ../bootstrap:/ralph/bootstrap:ro
      - notifier-state:/var/lib/ralph
    restart: unless-stopped

  # hermes-webui: a chat space for talking with the agents, alongside the
  # dashboard above rather than in place of it. Shares hermes-home with the
  # hermes service so it sees the same profiles, board, and sessions; the
  # agent's own image is unaware of it and needs no change beyond the
  # hermes-agent-src volume and the gateway key above.
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:${HERMES_WEBUI_VERSION:?set HERMES_WEBUI_VERSION, never latest}
    # Runs before the image's own entrypoint, never instead of it: it installs
    # the agent extras hermes-webui's startup misses, then execs
    # /hermeswebui_init.bash unchanged. See bootstrap/webui-entrypoint for why
    # a `[all]` install leaves the anthropic client out and why Hermes' lazy
    # install cannot fill the gap from here.
    entrypoint: ["/ralph/bootstrap/webui-entrypoint"]
    depends_on:
      hermes:
        condition: service_started
      # init fixes the mode of a lock file in the agent's source tree that
      # would otherwise break the rsync staging below. Without waiting for it
      # to finish, that fix races this service's own startup and the failure
      # it closes comes back intermittently on a fresh `docker compose up`.
      init:
        condition: service_completed_successfully
    environment:
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: 8787
      # Resolves which board to display from these two vars, not from
      # HERMES_HOME; cleared explicitly so an inherited pin from env_file or
      # a parent shell can never mislabel the live board.
      HERMES_KANBAN_DB: ""
      HERMES_KANBAN_BOARD: ""
      # Required: the image's init script exits without it. Its own volume
      # rather than a directory inside hermes-home, so chat sessions and
      # uploads sit apart from Hermes' state and its credentials, and can be
      # dropped without touching either.
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/webui-state
      # Build hermes-webui's venv on the same Python as the agent it runs.
      # Hermes pins every core dependency with `python_version >= '3.14'`, and
      # the image builds its venv on its own 3.12; under 3.12 those markers are
      # all false, so the install succeeds while skipping openai, httpx and
      # twenty more, and the chat cannot run the agent at all. The image's
      # init calls a bare `uv venv`, which honours UV_PYTHON, so this needs no
      # change to the image. A venv built before this was set is reused on
      # restart; remove the container once to rebuild it.
      UV_PYTHON: "3.14"
      # hermes's own volume is owned by UID/GID 10000 (see Dockerfile.init);
      # match it so hermes-webui can read the shared hermes-home volume.
      WANTED_UID: 10000
      WANTED_GID: 10000
      # Reaches the agent's gateway API over the compose network by this
      # stack's own service name, not hermes-webui's default "hermes-agent".
      HERMES_API_URL: http://hermes:8642
      # Must match the hermes service's API_SERVER_KEY above.
      HERMES_WEBUI_GATEWAY_API_KEY: ${RALPH_WEBUI_API_KEY:-}
    env_file:
      - path: ${RALPH_ENV_FILE:-./.env}
        required: false
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      # Read-only: hermes-webui only reads this to install the agent's
      # Python dependencies at startup, never to write it.
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - hermes-webui-state:/home/hermeswebui/webui-state
      - ../bootstrap:/ralph/bootstrap:ro
    ports:
      # Bound to localhost, same as the dashboard above. No authentication.
      - "127.0.0.1:${RALPH_WEBUI_PORT:-9220}:8787"
    restart: unless-stopped

volumes:
  # Named, not a bind mount of ~/.hermes: Ralph's Hermes state is its own.
  hermes-home:
  notifier-state:
  # Populated once, from the hermes image's own /opt/hermes, the first time
  # the hermes service starts. Not refreshed by a later docker pull/up --
  # see hermes-webui's entry in README.md's "Upgrading" section.
  hermes-agent-src:
  # hermes-webui's own sessions, workspaces and uploads.
  hermes-webui-state:
