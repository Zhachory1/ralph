name: ralph-v4

services:
  postgres:
    image: postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?Set PAPERCLIP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PAPERCLIP_DB_PORT:-5432}:5432"
    volumes:
      - paperclip-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  paperclip-db:
