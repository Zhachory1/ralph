name: Paperclip private preview

on:
  pull_request:
    branches: [v4-architecture]
    paths:
      - ".github/workflows/paperclip-private.yml"
      - "compose/v4/paperclip-private.yml"
      - "compose/v4/paperclip-canary.Dockerfile"
      - "compose/v4/paperclip-canary.Dockerfile.dockerignore"
      - "compose/v4/paperclip-handoff.patch"
      - "compose/v4/paperclip-protected-assignment.patch"
      - "compose/v4/provision-paperclip.py"
      - "compose/v4/council-judge-worker.py"
      - "compose/v4/chat-ingress.py"
      - "compose/v4/comms-intake-worker.mjs"
      - "compose/v4/test/paperclip-private-canary.py"
      - "compose/v4/test/paperclip-council-comments-canary.py"
      - "compose/v4/test/paperclip-roster-canary.py"
      - "compose/v4/test/paperclip-rfc-canary.py"
      - "compose/v4/test/paperclip-rfc-review-stage-canary.py"
      - "compose/v4/test/paperclip-wakeup-canary.py"
      - "compose/v4/test/paperclip-board-key-canary.py"
      - "compose/v4/test/test-chat-ingress.py"
      - "compose/v4/test/comms-intake-worker.test.mjs"
      - "compose/v4/test/paperclip-chat-ingress-canary.py"
      - "compose/v4/test/paperclip-chat-oidc-canary.py"
      - "profiles/PRINCIPLES.md"
      - "profiles/council/rubric-v1.md"
      - "profiles/librarian/SOUL.md"

permissions:
  contents: read

jobs:
  clean-host-bootstrap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build the pinned preview image
        run: |
          docker build --no-cache --network none \
            -t ralph-paperclip-private:2026.1117.0 \
            -f compose/v4/paperclip-canary.Dockerfile compose/v4
      - name: Verify local-only access and persistence
        run: python3 compose/v4/test/paperclip-private-canary.py
      - name: Verify native review and confirmation
        run: |
          docker tag ralph-paperclip-private:2026.1117.0 ralph-paperclip-canary:2026.1117.0
          python3 compose/v4/test/paperclip-rfc-review-stage-canary.py
          python3 compose/v4/test/paperclip-rfc-canary.py
          python3 compose/v4/test/paperclip-wakeup-canary.py
          python3 compose/v4/test/paperclip-council-comments-canary.py
          python3 compose/v4/test/paperclip-roster-canary.py
          python3 compose/v4/test/paperclip-chat-ingress-canary.py
          python3 compose/v4/test/paperclip-chat-oidc-canary.py
      - name: Verify Chat ingress boundaries
        run: |
          python3 compose/v4/test/test-chat-ingress.py
          node --test compose/v4/test/comms-intake-worker.test.mjs
      - name: Verify standalone host boundary
        run: |
          node --test --test-concurrency=1 compose/v4/test/council-judge.test.mjs \
            compose/v4/test/council-verdict.test.mjs compose/v4/test/council-panel.test.mjs \
            compose/v4/test/council-v1.test.mjs compose/v4/test/request-routing.test.mjs
      - name: Test native handoff recovery
        run: |
          docker run --rm --network none --user node --entrypoint sh -w /app/server \
            ralph-paperclip-private:2026.1117.0 -c \
            './node_modules/.bin/vitest run src/__tests__/heartbeat-handoff-execution-wait.test.ts src/services/heartbeat/retries.test.ts --maxWorkers=1 --no-file-parallelism --silent'
          docker run --rm --network none --user node --entrypoint sh -w /app/server \
            ralph-paperclip-private:2026.1117.0 -c \
            './node_modules/.bin/vitest run src/modules/wake-queue/domain/policy.test.ts src/modules/wake-queue/application/use-cases.test.ts src/modules/wake-queue/adapters/postgres.test.ts --maxWorkers=1 --no-file-parallelism --silent'
          docker run --rm --network none --user node --entrypoint sh -w /app/server \
            ralph-paperclip-private:2026.1117.0 -c \
            './node_modules/.bin/vitest run src/__tests__/heartbeat-process-recovery.test.ts --maxWorkers=1 --no-file-parallelism --silent -t "paused (conversation repair|repair)"'
          docker run --rm --network none --user node --entrypoint sh -w /app/server \
            ralph-paperclip-private:2026.1117.0 -c \
            './node_modules/.bin/vitest run src/__tests__/legacy-continuation-authority.test.ts src/modules/run-dispatch/domain/policy.test.ts src/modules/run-dispatch/adapters/postgres.test.ts --maxWorkers=1 --no-file-parallelism --silent'
      - name: Export tested server runtime
        run: |
          git rev-parse HEAD^1 > "$RUNNER_TEMP/paperclip-runtime-base"
          git rev-parse HEAD^2 > "$RUNNER_TEMP/paperclip-runtime-head"
          test "$(cat "$RUNNER_TEMP/paperclip-runtime-base")" = "${{ github.event.pull_request.base.sha }}"
          test "$(cat "$RUNNER_TEMP/paperclip-runtime-head")" = "${{ github.event.pull_request.head.sha }}"
          id=$(docker create --entrypoint /bin/true ralph-paperclip-private:2026.1117.0)
          trap 'docker rm "$id" >/dev/null' EXIT
          docker cp "$id:/app/server/dist-runtime" "$RUNNER_TEMP/dist-runtime"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/paperclip-runtime.tar.gz" dist-runtime
          (cd "$RUNNER_TEMP" && sha256sum paperclip-runtime.tar.gz > paperclip-runtime.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paperclip-runtime-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/paperclip-runtime.tar.gz
            ${{ runner.temp }}/paperclip-runtime.sha256
            ${{ runner.temp }}/paperclip-runtime-base
            ${{ runner.temp }}/paperclip-runtime-head
          retention-days: 1
          if-no-files-found: error
