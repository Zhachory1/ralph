# Fail an agent pull request that changed more than its card asked for.
#
# The plan belongs to the Kanban card, which is written before the work starts.
# A runner cannot read that card — the board is a SQLite file on the operator's
# own machine — so the worker copies the <planned_files> block into its commit
# message, which is the strongest thing a runner can see. That is weaker, since
# a worker writes its own commit; the card stays the record, and a machine with
# Hermes can check against it directly with `--card`.
#
# Copy this into any repository a builder can push to.

name: scope check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  scope:
    # Only agent work is scoped this way. A human opening a pull request has
    # already made the judgement this check exists to ask for.
    if: contains(github.event.pull_request.labels.*.name, 'agent-authored')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the base branch, so it needs its history.
          fetch-depth: 0

      - name: Require a card id
        run: |
          # The trailer is what makes the diff traceable to the card that
          # authorised it. No trailer, no plan, and the check fails rather
          # than passing silently.
          card=$(git log --format=%B "origin/${{ github.base_ref }}...HEAD" \
                 | sed -n 's/^Kanban-Card:[[:space:]]*//p' | head -1)
          if [ -z "${card}" ]; then
            echo "No Kanban-Card trailer on any commit in this pull request."
            echo "An agent pull request must be traceable to the card that scoped it."
            exit 1
          fi
          echo "card ${card}"

      - name: Check scope
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bootstrap/scope-check \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --from-commits \
            --labels "$LABELS"
