# Fail a pull request that publishes something internal in skills/.
#
# This repository is public. skills/README.md rule 4 keeps internal names out of
# it, and that rule is a judgement a reviewer makes while reading. This is the
# backstop for when nobody read closely enough.
#
# Unlike the scope check, this runs on every pull request, agent-authored or
# not: a human can publish an internal name by accident just as easily, and the
# cost of the mistake does not depend on who made it.
#
# The full marker list lives in the private overlay. A public runner cannot see
# it, so this runs in public-only mode and says so in its output. That is a real
# gap, not a hidden one: a reviewer with the overlay checked out can run the
# same check with --markers and get the complete answer.

name: skills public

on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/check-skills-public"
      - "evals/test_third_party_install.py"
      - "bootstrap/install-third-party-skills"

jobs:
  skills-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan skills/ for internal markers
        run: python3 evals/check-skills-public

      - name: Installer tests
        run: python3 evals/test_third_party_install.py

      # A fresh checkout has none of them installed, so --check would always
      # report drift. Installing for real is the useful test: it proves every
      # pin still resolves upstream, which is the way this manifest rots.
      - name: Third-party skills install from their pins
        run: |
          python3 bootstrap/install-third-party-skills
          python3 bootstrap/install-third-party-skills --check

      # The installed tree is scanned too: a referenced skill is as public as
      # a committed one.
      - name: Rescan with the third-party skills in place
        run: python3 evals/check-skills-public
