# Skills that are someone else's work, installed by reference and never vendored.
#
# Rule 2 of skills/README.md: a skill with a LICENSE naming another copyright
# holder, or a git remote outside this account, is pinned here instead of being
# copied into a lane. The skills listed here are fetched at build time into
# the lane each names, so the mounted tree holds more than the repository does.
#
# Pins are commits, not tags or branches, so what the agents load is the thing
# that was reviewed rather than whatever upstream has since become.
#
# Changing a pin is a pull request like any other: the diff is one line, and the
# question it asks is "has this upstream changed in a way we want".

skills:
  - name: stop-slop
    lane: voice
    upstream: https://github.com/hardikpandya/stop-slop
    commit: 8da1f030185bdfe8471220585162991eaeb970e9
    license: MIT
    copyright: Hardik Pandya

  - name: caveman
    lane: voice
    upstream: https://github.com/JuliusBrussee/caveman
    # The skill only. The upstream also ships Claude Code hooks and commands;
    # Ralph loads skills, not plugins, so none of those come along.
    subdir: skills/caveman
    commit: 9b68f7ed12b05e7efaff18e65c5a3fc2849fd0a4
    license: Apache-2.0
    copyright: Julius Brussee

  - name: debug-investigation
    lane: debug
    upstream: https://github.com/Zhachory1/autopraxis
    # Lives under skills/ in a larger repository, so the install takes the
    # subdirectory rather than the whole tree.
    subdir: skills/debug-investigation
    commit: 5204549c4c8fb74ba6922d7f090f51c6d221399d
    license: MIT
    copyright: Zhachory Volker

  - name: pr-review
    lane: review
    upstream: https://github.com/Zhachory1/autopraxis
    subdir: skills/pr-review
    commit: 5204549c4c8fb74ba6922d7f090f51c6d221399d
    license: MIT
    copyright: Zhachory Volker
